server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # запросы к бэку; ссылка отчёта /api/runs/{id}/report тоже идёт сюда
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # страницы фронта (в т.ч. /runs/{id}) отдаёт index.html
    location / {
        try_files $uri /index.html;
    }
}
