services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATASETS_DIR: /data
      DATA_DIR: /var/razlichalka
    volumes:
      # датасет не лежит в Git — подключаем только на чтение
      - ${DATASETS_PATH:-./ПАКЕТ/ЗАДАНИЕ/data}:/data:ro
      # результаты запусков переживают перезапуск
      - razlichalka_var:/var/razlichalka
    restart: unless-stopped

volumes:
  razlichalka_var:
