services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATASETS_DIR: /data
      DATA_DIR: /var/razlichalka
      CHECKS_DIR: /checks
      # «Мнение ИИ»: облачная Gemma напрямую в ollama.com, ключ — из .env
      OLLAMA_URL: ${OLLAMA_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-2}
    volumes:
      # датасет не лежит в Git — подключаем только на чтение
      - ${DATASETS_PATH:-./ПАКЕТ/ЗАДАНИЕ/data}:/data:ro
      # проверки организаторов (check_*.py) — тоже только на чтение
      - ${CHECKS_PATH:-./ПАКЕТ/ЗАДАНИЕ/checks}:/checks:ro
      # результаты запусков переживают перезапуск
      - razlichalka_var:/var/razlichalka
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  razlichalka_var:
